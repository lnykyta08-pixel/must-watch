<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Must-Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="magazine-shell">
    <div id="translate-global" class="lang-switch" role="group" aria-label="Мова сайту">
        <button class="lang-option" data-lang="ua" type="button">UA</button>
        <button class="lang-option" data-lang="en" type="button">EN</button>
    </div>
    <div id="magazine" class="closed">
        <button id="magazine-close" class="magazine-close">✕</button>
        <div id="pages" class="pages">

<!-- Обкладинка -->

            <div class="leaf leaf-cover">
                <div class="cover-face">
                    <div class="cover-top">
                        <span class="cover-title-small"
                            data-ua="Особистий журнал переглядів"
                            data-en="Personal Viewing Journal"></span>
                        <div class="cover-divider">
                            <span></span>
                            <i>✦</i>
                            <span></span>
                        </div>
                        <span class="cover-issue"
                            data-ua="№1 • 2026"
                            data-en="No. 1 • 2026"></span>
                    </div>
                    <header class="cover-header">
                        <h1 class="cover-logo">MUST-WATCH</h1>
                        <p class="cover-slogan"
                            data-ua="Твій кіносвіт. Твої історії. Твої враження."
                            data-en="Your world of film. Your stories. Your impressions."></p>
                    </header>
                    <section class="stats-panel">
                        <div class="stat cat-movie">
                            <span class="number">121</span>
                            <span class="label"
                                data-ua="Фільми"
                                data-en="films"></span>
                        </div>
                        <div class="stat cat-series">
                            <span class="number">27</span>
                            <span class="label"
                                data-ua="Серіали"
                                data-en="Series"></span>
                        </div>
                        <div class="stat cat-cartoon">
                            <span class="number">21</span>
                            <span class="label"
                                data-ua="Мультфільми"
                                data-en="Cartoons"></span>
                        </div>
                        <div class="stat cat-anime">
                            <span class="number">5</span>
                            <span class="label"
                                data-ua="Аніме"
                                data-en="Anime"></span>
                        </div>
                    </section>
                    <footer class="cover-footer">
                        <span></span>
                        <p data-ua="Гортай стрілками"
                            data-en="Flip with the arrows"></p>
                        <span></span>
                    </footer>
                </div>
            </div>

<!-- 1 сторінка -->

            <div class="leaf leaf-spread" data-category="movie">
                <div class="sheet left">
                    <img class="poster"
                        data-src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=900&q=80">
                </div>
                <div class="sheet right">
                    <div class="desc">
                        <div class="title-row">
                            <h2 class="movie-title"
                                data-ua="Американський огірочок"
                                data-en="American Pickle"></h2>
                            <span class="movie-year">2020</span>
                        </div>
                        <p class="desc-text"
                            data-ua="Це фільм, у якому через постер, назву та концепцію символ маринованого огірочка використовується для уособлення збереження традиційних сімейних цінностей. Навіть Бен, придумуючи назву застосунку «BoopBop», мав на увазі, що «Boop» символізує батька, а «Bop» – матір."
                            data-en="Is a film that, through its poster, title, and concept, uses the symbol of a pickled cucumber to represent the preservation of traditional family values. Even Ben, in the idea behind the app name «BoopBop», meant «Boop» to be the father and «Bop» to be the mother."></p>
                    </div>
                </div>
                <div class="rating">
                    <span class="rating-label"
                        data-ua="Оцінка"
                        data-en="Rating"></span>
                    <span class="rating-value">6<span class="rating-max">/10</span></span>
                </div>
            </div>

<!-- 2 сторінка -->

            <div class="leaf leaf-spread" data-category="movie">
                <div class="sheet left">
                    <img class="poster"
                        src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=900&q=80">
                </div>
                <div class="sheet right">
                    <div class="desc">
                        <div class="title-row">
                            <h2 class="movie-title"
                                data-ua="Антарктида"
                                data-en="Antarctica"></h2>
                            <span class="movie-year">2025</span>
                        </div>
                        <p class="desc-text"
                            data-ua="Це фільм про 30-ту"
                            data-en="Is a film about the 30th Ukrainian Antarctic Expedition and life at the Akademik Vernadsky Station."></p>
                    </div>
                </div>
                <div class="rating">
                    <span class="rating-label"
                        data-ua="Оцінка"
                        data-en="Rating"></span>
                    <span class="rating-value">10<span class="rating-max">/10</span></span>
                </div>
            </div>

<!-- Задня палітурка -->

            <div class="leaf leaf-back">
                <div class="back-face">
                    <div class="back-monogram">MW</div>
                    <p class="back-tagline"><span class="brand">Must-Watch</span> • <span
                            data-ua="Особистий журнал переглядів"
                            data-en="Personal Viewing Journal"></span></p>
                </div>
            </div>
        </div>
    </div>
    <div class="magazine-nav">
        <button id="nav-prev" class="nav-arrow">‹</button>
        <button id="nav-next" class="nav-arrow">›</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
